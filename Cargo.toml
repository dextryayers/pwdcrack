[workspace]
resolver = "2"
members = [
    ".",
    "engines/engine-bridge",
    "engines/engine-simd",
    "engines/engine-gpu",
    "engines/engine-fpga",
    "engines/engine-jit",
    "engines/engine-power",
    "engines/engine-distributed",
    "engines/engine-web",
    "engines/engine-android",
    "engines/engine-cuda",
    "engines/engine-opencl",
    "engines/engine-vulkan",
    "engines/engine-julia",
    "engines/engine-go",
    "engines/engine-wasm",
    "engines/engine-tpu",
    "engines/engine-riscv",
    "engines/engine-zen",
    "engines/engine-xpu",
    "engines/engine-warp",
    "engines/engine-metal",
    "engines/engine-dsp",
    "engines/engine-tensor",
    "engines/engine-embedded",
    "engines/engine-hybrid",
]

[package]
name = "pwdcrack"
version = "1.2.0"
edition = "2024"
description = "Universal password cracker: all hardware, all platforms"
authors = ["pwdcrack team"]
license = "MIT"
repository = "https://github.com/pwdcrack/pwdcrack"

# ============================================================
# FEATURES: Hardware Tier System
# ============================================================
[features]
default = ["tier-auto"]

# Auto-detect hardware tier at runtime
tier-auto = []

# Manual tier selection
tier-low   = ["simd-scalar", "io-stream", "progress-simple"]
tier-mid   = ["simd-detect", "mmap", "progress-rich"]
tier-high  = [
    "simd-detect", "mmap", "huge-pages",
    "engine-gpu", "engine-power",
    "progress-rich"
]

# === SIMD Sub-features (mutually exclusive groups) ===
simd-scalar = []
simd-sse2   = ["simd-scalar"]
simd-avx2   = ["simd-sse2"]
simd-avx512 = ["simd-avx2"]
simd-neon32 = ["simd-scalar"]
simd-neon64 = ["simd-scalar"]
simd-sve    = ["simd-neon64"]
simd-detect = []

# === I/O Sub-features ===
mmap        = ["dep:memmap2"]
io-stream   = []
huge-pages  = ["mmap"]

# === Progress Bar (always enabled, indicatif is a core dependency) ===
progress-simple = []
progress-rich   = []

# === External Engine Integration ===
engine-simd = ["dep:engine-simd"]
engine-gpu  = ["dep:engine-gpu"]
engine-fpga = ["dep:engine-fpga"]
engine-jit  = ["dep:engine-jit"]
engine-power = ["dep:engine-power"]
# `dep:tokio` is required because the synchronous CLI has to host the engine's
# async `run()` on its own runtime. Without it the binary cannot drive the
# distributed engine at all.
engine-distributed = ["dep:engine-distributed", "dep:tokio"]
# `dep:tokio` for the same reason as engine-distributed: the CLI is synchronous,
# so it has to build a runtime to host the dashboard's async server. Without it
# the `web` subcommand cannot exist.
engine-web  = ["dep:engine-web", "dep:tokio"]
engine-android = ["dep:engine-android"]
engine-cuda = ["dep:engine-cuda"]
engine-opencl = ["dep:engine-opencl"]
engine-vulkan = ["dep:engine-vulkan"]
engine-julia = ["dep:engine-julia"]
engine-go = ["dep:engine-go"]
engine-wasm = ["dep:engine-wasm"]
engine-tpu = ["dep:engine-tpu"]
engine-riscv = ["dep:engine-riscv"]
engine-zen = ["dep:engine-zen"]
engine-xpu = ["dep:engine-xpu"]
engine-warp = ["dep:engine-warp"]
engine-metal = ["dep:engine-metal"]
engine-dsp = ["dep:engine-dsp"]
engine-tensor = ["dep:engine-tensor"]
engine-embedded = ["dep:engine-embedded"]
engine-hybrid = ["dep:engine-hybrid"]

# === Platform-specific ===
android = ["engine-android"]
distributed = ["engine-distributed"]

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hash_bench"
harness = false

# ============================================================
# DEPENDENCIES
# ============================================================
[dependencies]
# Core libraries
rayon = "1"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
# The `serde` feature is required for the session checkpoint format, which
# serialises with `bincode::serde::encode_to_vec` and needs `serde::Serialize`
# rather than bincode's own derive feature.
bincode = { version = "2", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
hashbrown = "0.14"
dashmap = "6"
cfg-if = "1"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Async runtime
# Only needed to host the distributed engine's tokio task from the synchronous
# CLI entry point. Pinned to the same major version engine-distributed uses so
# cargo resolves a single copy rather than two incompatible ones.
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

# Hash: always included, pure Rust
md-5 = "0.10"
des = "0.9"
cipher = "0.5"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
md4 = "0.10"
whirlpool = "0.10"
streebog = "0.10"
tiger = "0.1"
skein = "0.1"
jh = "0.1"
shabal = "0.4"
gost94 = "0.10"
blake3 = "1"
sm3 = "0.4"
groestl = "0.10"
bcrypt = "0.16"
argon2 = "0.5"
scrypt = "0.11"
hex = "0.4"
base64ct = "1"
hmac = "0.12"
pbkdf2 = "0.12"
crc32fast = "1"
crc64 = "2"
adler = "1"
regex = "1"
digest = "0.10"
serde_json = "1"

# Workspace engine crates (optional)
engine-simd = { path = "engines/engine-simd", optional = true }
engine-gpu  = { path = "engines/engine-gpu", optional = true }
engine-fpga = { path = "engines/engine-fpga", optional = true }
engine-jit  = { path = "engines/engine-jit", optional = true }
engine-power = { path = "engines/engine-power", optional = true }
engine-distributed = { path = "engines/engine-distributed", optional = true }
engine-web  = { path = "engines/engine-web", optional = true }
engine-android = { path = "engines/engine-android", optional = true }
engine-cuda = { path = "engines/engine-cuda", optional = true }
engine-opencl = { path = "engines/engine-opencl", optional = true }
engine-vulkan = { path = "engines/engine-vulkan", optional = true }
engine-julia = { path = "engines/engine-julia", optional = true }
engine-go = { path = "engines/engine-go", optional = true }
engine-wasm = { path = "engines/engine-wasm", optional = true }
engine-tpu = { path = "engines/engine-tpu", optional = true }
engine-riscv = { path = "engines/engine-riscv", optional = true }
engine-zen = { path = "engines/engine-zen", optional = true }
engine-xpu = { path = "engines/engine-xpu", optional = true }
engine-warp = { path = "engines/engine-warp", optional = true }
engine-metal = { path = "engines/engine-metal", optional = true }
engine-dsp = { path = "engines/engine-dsp", optional = true }
engine-tensor = { path = "engines/engine-tensor", optional = true }
engine-embedded = { path = "engines/engine-embedded", optional = true }
engine-hybrid = { path = "engines/engine-hybrid", optional = true }

[lib]
crate-type = ["lib", "cdylib"]
name = "pwdcrack"

# mmap-based wordlist streaming
[target.'cfg(any(unix, windows))'.dependencies.memmap2]
version = "0.9"
optional = true

# Platform-specific
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = ["Win32_System_Memory", "Win32_Storage_FileSystem"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# ============================================================
# PROFILE CONFIGURATION
# ============================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# `panic` is deliberately NOT "abort", which is what this profile used to set.
#
# B-36. engine-bridge builds a cdylib and a staticlib, and both are loaded into
# somebody else's process. Three consequences of aborting:
#
# 1. A panic anywhere in the library kills the host program. A cracker parses
#    attacker supplied hash strings, so a panic below is a thing that will
#    eventually happen, and taking the embedder's process down is not an
#    acceptable failure mode for a library.
# 2. `catch_unwind` becomes inert, so the guard around each attack in
#    engines/engine-bridge/src/c_api.rs could not catch anything. It would have
#    looked like it worked and turned every panic into an abort.
# 3. An unwind crossing the FFI boundary is undefined behaviour, so "abort" is
#    not even the safe choice at an FFI edge; it is the one that removes the
#    possibility of handling it at all.
#
# The cost is a little binary size and no abort on the CLI's own paths. What
# that buys is that the CLI still reports a failed hash parse as a message
# instead of a core dump, which is the behaviour a user expects from a tool that
# is pointed at untrusted input.
#
# `engine_bridge::c_api::crack_panics_abort` reports the strategy actually in
# force, so a caller can see which guarantee it has rather than infer it.
panic = "unwind"

# Smaller binary for low-end targets
[profile.release-low]
inherits = "release"
opt-level = "z"    # optimize for size
lto = "thin"
codegen-units = 16

# Debug-friendly
[profile.dev]
opt-level = 0
debug = true

# Benchmarks need unwind for criterion
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

