[package]
name = "engine-distributed"
version = "0.1.0"
edition = "2024"
description = "Distributed cracking across network nodes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
hex = "0.4"
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
md4 = "0.10"
