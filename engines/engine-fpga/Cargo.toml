[package]
name = "engine-fpga"
version = "0.1.0"
edition = "2024"
description = "FPGA hash acceleration: Verilog cores + Rust PCIe driver"

[dependencies]
log = "0.4"
hex = "0.4"
thiserror = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Only the simulated device in tests/scheduler.rs needs a real digest. It is not a
# dependency of the library: a real FPGA computes the hash, and this crate never
# does.
[dev-dependencies]
md5 = "0.7"
