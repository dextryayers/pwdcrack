[package]
name = "engine-julia"
version = "0.1.0"
edition = "2024"
description = "Julia-language runtime bridge for shared-memory hash cracking kernels"

[dependencies]
log = "0.4"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
jlrs = { version = "0.20", optional = true }

[features]
default = []
julia = ["dep:jlrs"]
