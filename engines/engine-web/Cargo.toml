[package]
name = "engine-web"
version = "0.1.0"
edition = "2024"
description = "Real-time web dashboard for pwdcrack"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", optional = true, features = ["ws"] }
chrono = { version = "0.4", optional = true }

[features]
default = ["server"]
server = ["tokio", "axum", "chrono"]
