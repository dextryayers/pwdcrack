[package]
name = "engine-web"
version = "0.1.0"
edition = "2024"
description = "Real-time web dashboard for pwdcrack"

[dependencies]
# Note: this crate cannot depend on `pwdcrack`. `pwdcrack` depends on
# engine-web, so a reverse edge is a cycle and cargo rejects it outright.
#
# The real execution path is therefore injected: engine-web defines
# `AttackExecutor` and the binary supplies an implementation that calls the same
# engine the CLI uses. See `attack.rs`.

# Token generation. `getrandom` 0.2 is already in Cargo.lock as a transitive
# dependency, so this adds no new package to the graph.
getrandom = { version = "0.2", features = ["std"] }
hex = "0.4"

log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.7", optional = true, features = ["ws"] }
chrono = { version = "0.4", optional = true }

[features]
default = ["server"]
server = ["tokio", "axum", "chrono"]
