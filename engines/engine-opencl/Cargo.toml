[package]
name = "engine-opencl"
version = "0.1.0"
edition = "2024"
description = "OpenCL compute engine for cross-platform GPU hash cracking"

[dependencies]
ocl = { version = "0.20", optional = true }
log = "0.4"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
pwdcrack = { path = "../../" }

[features]
default = []
opencl = ["dep:ocl"]
