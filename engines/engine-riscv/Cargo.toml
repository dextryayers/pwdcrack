[package]
name = "engine-riscv"
version = "0.1.0"
edition = "2024"
description = "RISC-V Vector extension acceleration for hash cracking"

[dependencies]
log = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
pwdcrack = { path = "../../" }
riscv-vec = { version = "0.1", optional = true }

[features]
default = []
riscv = ["dep:riscv-vec"]
