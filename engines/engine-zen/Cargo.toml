[package]
name = "engine-zen"
version = "0.1.0"
edition = "2024"
description = "AMD Zen CPU optimization for AVX2/AVX-512 tuned hash cracking"

[dependencies]
log = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
pwdcrack = { path = "../../" }
amd-zen = { version = "0.1", optional = true }
raw-cpuid = "11"

[features]
default = []
zen = ["dep:amd-zen"]
