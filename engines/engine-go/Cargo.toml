[package]
name = "engine-go"
version = "0.1.0"
edition = "2024"
description = "Go language shared library bridge via dynamic loading"

[dependencies]
log = "0.4"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
libloading = { version = "0.8", optional = true }

[features]
default = []
go = ["dep:libloading"]
