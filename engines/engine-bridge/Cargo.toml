[package]
name = "engine-bridge"
version = "0.1.0"
edition = "2021"
description = "FFI bridges: C, Python (PyO3), Perl (XS), Node.js (N-API), Ruby"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
pwdcrack = { path = "../.." }

log = "0.4"
hex = "0.4"
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python bindings (optional, for maturin build)
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"], optional = true }

# Node.js N-API bindings (optional, for napi-rs build)
napi = { version = "2.16", features = ["default"], optional = true }
napi-derive = { version = "2.16", optional = true }
napi-sys = { version = "2.4", optional = true }

[features]
python = ["dep:pyo3", "dep:pyo3-asyncio"]
perl = []
node = ["dep:napi", "dep:napi-derive", "dep:napi-sys"]
ruby = []
default = []