[package]
name = "engine-bridge"
version = "1.2.0"
edition = "2021"
description = "FFI bridges: C, Python (PyO3), Perl (XS), Node.js (N-API), Ruby"

[lib]
# `rlib` is here so `cargo test` can link the crate for integration tests.
# Without it an integration test cannot name the crate at all, because a cdylib
# and a staticlib are both final artefacts and neither is importable by Rust.
# It changes what lands in target/, not what is shipped: the C and Python builds
# consume the cdylib and the staticlib, which are still produced.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pwdcrack = { path = "../.." }

log = "0.4"
hex = "0.4"
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python bindings (optional, for maturin build)
# PyO3 0.23 is required for Python 3.13 support; 0.20 refuses to build against it.
# pyo3-asyncio is intentionally not used: the Python surface is synchronous.
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

# Node.js N-API bindings (optional, for napi-rs build)
napi = { version = "2.16", features = ["default"], optional = true }
napi-derive = { version = "2.16", optional = true }
napi-sys = { version = "2.4", optional = true }

[features]
python = ["dep:pyo3"]
perl = []
node = ["dep:napi", "dep:napi-derive", "dep:napi-sys"]
# No `ruby` feature. It was declared with no module behind it, so
# `--features ruby` built exactly the same library as no features at all and
# appeared to offer a bridge that could not be used. Phase 11 does not list one;
# adding it means adding src/ruby.rs and a test suite, not a manifest line.
default = []